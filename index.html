<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Levi</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

.nome-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.nome {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: 1px;
}

.decor {
  font-size: 20px;
  opacity: 0.8;
}

.idade-box {
  display: flex;
  flex-direction: column; /* 👈 ESSA LINHA FAZ A MÁGICA */
  align-items: center;
  justify-content: center;
  margin-top: 10px;
}

.numero {
  font-size: 100px;
  font-weight: 700;
  background: linear-gradient(45deg, #69f0ff, #00c853);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.aninho {
  font-size: 22px;
  margin-top: -10px; /* aproxima do número */
  opacity: 0.9;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}



body {
  
  overflow: hidden;
  color: white;
}


/* VIDEO FUNDO */
#bg-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* OVERLAY PREMIUM */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    to top,
    rgba(0,0,0,0.7),
    rgba(0,0,0,0.2)
  );
  z-index: -1;
}

/* TELAS */
.screen {
  display: none;
  height: 100vh;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  padding: 25px;
}

.active {
  display: flex;
}

/* CARD */
.card {
  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.08);
  border-radius: 25px;
  padding: 30px;
  width: 100%;
  max-width: 350px;
  box-shadow: 0 0 40px rgba(0,0,0,0.3);
  animation: fadeUp 1s ease;
}

/* TEXTOS */



h1 {
  font-weight: 600;
  margin-bottom: 10px;
}

.nome {
  font-size: 28px;
}

.numero {
  font-size: 90px;
  font-weight: 600;
  line-height: 1;
}

.sub {
  font-size: 20px;
  margin-bottom: 15px;
}

/* INFO */
.info {
  margin: 8px 0;
  font-size: 16px;
  opacity: 0.9;
}

/* BOTÕES */
.btn {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border-radius: 50px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

/* BOTÃO PRINCIPAL */
.primary {
  background: linear-gradient(45deg, #00c853, #69f0ae);
  color: #003300;
  box-shadow: 0 5px 20px rgba(0,200,83,0.4);
}

/* BOTÃO SECUNDÁRIO */
.secondary {
  background: linear-gradient(45deg, #00b0ff, #69f0ff);
  color: #002b33;
  box-shadow: 0 5px 20px rgba(0,176,255,0.4);
}

/* EFEITO HOVER */
.btn:hover {
  transform: translateY(-3px) scale(1.03);
}

/* ANIMAÇÃO */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.fade {
  animation: fadeUp 1s ease;
}

.contador {
  margin-top: 15px;
  font-size: 16px;
  opacity: 0.9;
}

</style>
</head>

<body>

<audio id="musica" loop>
  <source src="mscmar.mp3" type="audio/mpeg">
</audio>

<!-- VIDEO -->
<video autoplay muted loop playsinline id="bg-video">
  <source src="videofundo.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- TELA 1 CONVITE -->
<div class="screen active">
  <div class="card">
    <h1>Você recebeu um convite 🎉</h1>
    <button class="btn primary" onclick="iniciarConvite()">Abrir convite</button>
  </div>
</div>

<!-- TELA 2 LEVI 1 ANINHO -->
<div class="screen">
  <div class="card">
<div class="nome-box">
  <span class="decor">🌊</span>
  <h1 class="nome">Levi</h1>
  <span class="decor">🌊</span>
</div>

<div class="idade-box">
  <span class="numero">1</span>
  <br>
  <span class="aninho">aninho</span>
</div>
    <button class="btn primary" onclick="next(3)">Continuar</button>
  </div>
</div>

<!-- TELA 3 VENHA PARTICIPAR DESSA AVENTURA-->
<div class="screen">
  <div class="card">
    <h1>Venha participar dessa aventura 🌊</h1>

<p id="contador" class="contador"></p>
    <button class="btn primary" onclick="next(4)">Ver detalhes</button>
  </div>
</div>

<!-- TELA 4 -->
<div class="screen">
  <div class="card">
    <div class="info">📅 19 de dezembro 📅</div>
    <div class="info">⏰ 14h00 ⏰</div>
    <div class="info">📍 Irashai 📍</div>
    <div class="info">Conto com a sua presença!</div>

    <button class="btn primary" onclick="confirmar()">Confirmar presença</button>
    <button class="btn secondary" onclick="abrirMapa()">Ver localização</button>
  </div>
</div>

<script>
function next(tela) {
  document.querySelectorAll('.screen').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.screen')[tela - 1].classList.add('active');
}

function confirmar() {
  let nome = prompt("Digite seu nome:");
  if(nome){
    let msg = "_Oiiii Amanda! Eu quero *confirmar* minha presença no *aniversário do Levi!*._: " + nome;
    window.open("https://wa.me/5544999639628?text=" + encodeURIComponent(msg));
  }
}

function abrirMapa() {
  window.open("https://maps.app.goo.gl/nZvVcdajkrjYLt979");
}

function iniciarConvite() {
  let musica = document.getElementById("musica");
  musica.play().catch(() => {});
  next(2);
}
function atualizarContador() {
  const dataEvento = new Date("2026-12-19T14:00:00"); // DATA DO EVENTO
  const agora = new Date();

  const diff = dataEvento - agora;

  if (diff <= 0) {
    document.getElementById("contador").innerText = "🎉 É hoje!";
    return;
  }

  const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
  const meses = Math.floor(dias / 30);
  const diasRestantes = dias % 30;

  document.getElementById("contador").innerText =
    `Faltam ${meses} meses e ${diasRestantes} dias para o aniversário 🎂`;
}

// atualiza automaticamente
setInterval(atualizarContador, 1000);
atualizarContador();

</script>

</body>
</html>
